name: Generate Pac-Man

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  pacman:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Pac-Man contribution SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Push Pac-Man SVG to output-pacman branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-pacman
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
